<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday, Anchal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --plum:#2b1b34;
    --plum-deep:#1c1024;
    --rose:#e88d8d;
    --gold:#f2c879;
    --cream:#fbf3e7;
    --coral:#e4694a;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(232,141,141,0.18), transparent),
      radial-gradient(ellipse 60% 40% at 85% 90%, rgba(242,200,121,0.10), transparent),
      var(--plum-deep);
    color:var(--cream);
    font-family:'Sora', sans-serif;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }

  .sky{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
  }
  .star{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:var(--gold);
    opacity:0.5;
    animation:twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:0.15; transform:scale(1);}
    50%{opacity:0.7; transform:scale(1.4);}
  }

  .balloons{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:1;
    overflow:hidden;
  }
  .balloon{
    position:absolute;
    bottom:-140px;
    width:46px;
    height:58px;
    border-radius:50% 50% 50% 50% / 58% 58% 42% 42%;
    opacity:0.85;
    animation:rise linear infinite;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,0.25));
  }
  .balloon::before{
    content:'';
    position:absolute;
    left:50%;
    top:100%;
    width:1px;
    height:34px;
    background:rgba(251,243,231,0.35);
    transform:translateX(-50%);
  }
  .balloon::after{
    content:'';
    position:absolute;
    left:50%;
    top:14%;
    width:10px;
    height:14px;
    background:rgba(255,255,255,0.35);
    border-radius:50%;
    transform:translateX(-50%) rotate(-20deg);
  }
  @keyframes rise{
    0%{ transform:translateY(0) translateX(0) rotate(-4deg); }
    50%{ transform:translateY(-56vh) translateX(18px) rotate(4deg); }
    100%{ transform:translateY(-118vh) translateX(-10px) rotate(-4deg); }
  }

  .deck{
    position:relative;
    height:100%;
    width:100%;
    z-index:2;
  }

  .slide{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:10vh 8vw;
    text-align:center;
    opacity:0;
    pointer-events:none;
    transform:translateY(18px) scale(0.9);
    transition:opacity 0.6s ease, transform 0.6s cubic-bezier(.34,1.56,.64,1);
  }
  .slide.active{
    opacity:1;
    pointer-events:auto;
    transform:translateY(0) scale(1);
  }

  .eyebrow{
    letter-spacing:0.3em;
    text-transform:uppercase;
    font-size:11px;
    color:var(--rose);
    margin-bottom:22px;
    opacity:0.85;
  }

  .big{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(2rem, 7.5vw, 3.6rem);
    line-height:1.12;
    margin:0;
    background:linear-gradient(180deg, var(--cream) 30%, var(--gold) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .line-text{
    font-family:'Fraunces', serif;
    font-size:clamp(1.5rem, 5.5vw, 2.4rem);
    line-height:1.35;
    max-width:600px;
    color:var(--cream);
    margin:0;
  }
  .line-text.joke{
    color:var(--rose);
    font-style:italic;
  }
  .heart{
    color:var(--coral);
    display:inline-block;
    animation:pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.18); }
  }

  .signature{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:clamp(1.2rem, 4.5vw, 1.6rem);
    color:var(--gold);
    margin:0;
  }

  .sparkle{
    position:fixed;
    z-index:1;
    pointer-events:none;
    font-size:16px;
    opacity:0;
    animation:sparkle-life ease-in-out forwards;
  }
  @keyframes sparkle-life{
    0%{ opacity:0; transform:translateY(0) scale(0.4) rotate(0deg); }
    15%{ opacity:0.9; transform:translateY(-10px) scale(1) rotate(15deg); }
    85%{ opacity:0.7; }
    100%{ opacity:0; transform:translateY(-70px) scale(0.5) rotate(-15deg); }
  }

  .tap-heart{
    position:fixed;
    z-index:6;
    pointer-events:none;
    font-size:22px;
    animation:tap-heart-life 0.9s ease-out forwards;
  }
  @keyframes tap-heart-life{
    0%{ opacity:0.95; transform:translate(-50%,-50%) scale(0.6); }
    60%{ opacity:0.9; transform:translate(-50%,-50%) translateY(-30px) scale(1.15); }
    100%{ opacity:0; transform:translate(-50%,-50%) translateY(-55px) scale(0.9); }
  }

  /* ---------- cake cutting scene ---------- */
  .cake-instruction{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:clamp(1.2rem, 5vw, 1.8rem);
    color:var(--gold);
    margin-bottom:20px;
    text-shadow:0 0 14px rgba(242,200,121,0.5);
    animation:pulseText 1.6s ease-in-out infinite alternate;
    transition:opacity 0.4s ease;
  }
  @keyframes pulseText{
    0%{ transform:scale(1); opacity:0.85; }
    100%{ transform:scale(1.04); opacity:1; }
  }

  .cake-wrapper{
    position:relative;
    width:240px;
    height:240px;
    cursor:pointer;
  }

  .cake-3d-container{
    position:absolute;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:240px;
    height:240px;
    transform-style:preserve-3d;
  }
  .cake-3d-container.shaking{
    animation:cakeShake 0.1s 3;
  }
  @keyframes cakeShake{
    0%{ transform:translateX(-50%); }
    25%{ transform:translateX(calc(-50% - 3px)); }
    50%{ transform:translateX(-50%); }
    75%{ transform:translateX(calc(-50% + 3px)); }
    100%{ transform:translateX(-50%); }
  }

  .cake-half{
    position:absolute;
    width:100%;
    height:100%;
    transform-style:preserve-3d;
    transition:transform 1.5s cubic-bezier(0.175,0.885,0.32,1.275);
  }
  .cake-half.left{ clip-path:polygon(0 0, 50% 0, 50% 100%, 0 100%); }
  .cake-half.right{ clip-path:polygon(50% 0, 100% 0, 100% 100%, 50% 100%); }

  .cake-wrapper.cut .cake-half.left{
    transform:translateX(-56px) rotateY(-25deg) rotateZ(-5deg);
  }
  .cake-wrapper.cut .cake-half.right{
    transform:translateX(56px) rotateY(25deg) rotateZ(5deg);
  }

  .magical-light{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%) scale(0);
    width:220px;
    height:220px;
    background:radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(242,200,121,0.8) 30%, rgba(255,255,255,0) 70%);
    border-radius:50%;
    pointer-events:none;
    z-index:10;
    animation:lightBurst 1.5s ease-out forwards;
    mix-blend-mode:screen;
  }
  @keyframes lightBurst{
    0%{ transform:translate(-50%,-50%) scale(0); opacity:0; }
    20%{ opacity:1; }
    100%{ transform:translate(-50%,-50%) scale(3); opacity:0; }
  }

  .svg-flame{
    transform-origin:100px 24px;
    animation:svgFlicker 0.1s infinite alternate;
    transition:opacity 0.3s ease, transform 0.3s ease;
  }
  .svg-flame-glow{
    transform-origin:100px 15px;
    animation:svgGlow 0.1s infinite alternate;
    transition:opacity 0.3s ease, transform 0.3s ease;
  }
  @keyframes svgFlicker{
    0%{ transform:scale(1) rotate(-2deg); opacity:0.9; }
    100%{ transform:scale(1.05) rotate(2deg); opacity:1; }
  }
  @keyframes svgGlow{
    0%{ transform:scale(0.9); opacity:0.6; }
    100%{ transform:scale(1.1); opacity:0.9; }
  }

  .knife-wrapper{
    position:absolute;
    top:-160px;
    left:50%;
    transform:translateX(-50%);
    width:34px;
    height:170px;
    z-index:20;
    opacity:0;
    pointer-events:none;
    filter:drop-shadow(0 15px 15px rgba(0,0,0,0.5));
  }
  .knife-wrapper.slashing{
    animation:elegantCut 2s cubic-bezier(0.25,1,0.5,1) forwards;
  }
  @keyframes elegantCut{
    0%{ top:-260px; transform:translateX(45px) rotate(45deg); opacity:0; }
    20%{ top:-70px; transform:translateX(-50%) rotate(0deg); opacity:1; }
    35%{ top:-70px; transform:translateX(-50%) rotate(0deg); opacity:1; }
    55%{ top:96px; transform:translateX(-50%) rotate(0deg); opacity:1; }
    75%{ top:64px; transform:translateX(18px) rotate(30deg); opacity:1; }
    100%{ top:-130px; transform:translateX(90px) rotate(60deg); opacity:0; }
  }

  .burst-piece{
    position:fixed;
    pointer-events:none;
    z-index:100;
    font-size:20px;
  }

  /* ---------- panda mascot ---------- */
  .panda-frame{
    width:120px;
    height:120px;
    border-radius:50%;
    overflow:hidden;
    margin-bottom:18px;
    background:#cfe3cf;
    box-shadow:0 10px 24px rgba(0,0,0,0.3), 0 0 0 4px rgba(251,243,231,0.08);
    animation:panda-bounce 2.4s ease-in-out infinite;
  }
  .panda-frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .panda-frame.small{
    width:88px;
    height:88px;
  }
  @keyframes panda-bounce{
    0%,100%{ transform:translateY(0) rotate(-2deg) scale(1); }
    25%{ transform:translateY(-14px) rotate(2deg) scale(1.02); }
    50%{ transform:translateY(0) rotate(-1deg) scale(1); }
    75%{ transform:translateY(-6px) rotate(2deg) scale(1.01); }
  }

  .replay-btn{
    margin-top:30px;
    padding:12px 26px;
    border-radius:999px;
    border:1px solid rgba(242,200,121,0.4);
    background:rgba(242,200,121,0.08);
    color:var(--gold);
    font-family:'Sora', sans-serif;
    font-size:13px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    cursor:pointer;
  }
  .replay-btn:active{ transform:scale(0.97); }

  .dots{
    position:fixed;
    bottom:5vh;
    left:0; right:0;
    display:flex;
    justify-content:center;
    gap:8px;
    z-index:4;
  }
  .dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:rgba(251,243,231,0.25);
    transition:background 0.4s ease, transform 0.4s ease;
  }
  .dot.active{
    background:var(--gold);
    transform:scale(1.4);
  }

  .tap-zone{
    position:fixed;
    top:0; bottom:0;
    width:35%;
    z-index:3;
  }
  .tap-zone.left{ left:0; }
  .tap-zone.right{ right:0; }

  .confetti-piece{
    position:fixed;
    top:-10px;
    z-index:5;
    border-radius:2px;
    pointer-events:none;
  }

  @media (max-width:420px){
    .cake-wrapper, .cake-3d-container{ width:200px; height:200px; }
    .cake-wrapper.cut .cake-half.left{ transform:translateX(-46px) rotateY(-25deg) rotateZ(-5deg); }
    .cake-wrapper.cut .cake-half.right{ transform:translateX(46px) rotateY(25deg) rotateZ(5deg); }
  }

  @media (prefers-reduced-motion: reduce){
    .slide{ transition:none; }
  }
</style>
</head>
<body>

<div class="sky" id="sky"></div>
<div class="balloons" id="balloons"></div>

<div class="deck" id="deck"></div>

<div class="dots" id="dots"></div>
<div class="tap-zone left" id="zoneLeft"></div>
<div class="tap-zone right" id="zoneRight"></div>

<script>
  // starfield
  const sky = document.getElementById('sky');
  for(let i=0;i<40;i++){
    const s = document.createElement('div');
    s.className='star';
    s.style.left = Math.random()*100+'%';
    s.style.top = Math.random()*100+'%';
    s.style.animationDelay = (Math.random()*4)+'s';
    sky.appendChild(s);
  }

  // floating balloons
  const balloonColors = ['#e88d8d', '#f2c879', '#e4694a', '#c99bd8', '#f7e2b8'];
  const balloonsEl = document.getElementById('balloons');
  const balloonCount = 7;
  for(let i=0;i<balloonCount;i++){
    const b = document.createElement('div');
    b.className = 'balloon';
    const size = 34 + Math.random()*26;
    b.style.width = size+'px';
    b.style.height = (size*1.25)+'px';
    b.style.left = Math.random()*100+'%';
    b.style.background = `radial-gradient(circle at 32% 28%, rgba(255,255,255,0.35), ${balloonColors[i % balloonColors.length]} 60%)`;
    const dur = 14 + Math.random()*12;
    b.style.animationDuration = dur+'s';
    b.style.animationDelay = (-Math.random()*dur)+'s';
    b.style.opacity = (0.55 + Math.random()*0.35).toFixed(2);
    balloonsEl.appendChild(b);
  }

  // ambient sparkles
  const sparkleGlyphs = ['✨','💛','💫'];
  function spawnSparkle(){
    const el = document.createElement('div');
    el.className = 'sparkle';
    el.textContent = sparkleGlyphs[Math.floor(Math.random()*sparkleGlyphs.length)];
    el.style.left = (5 + Math.random()*90)+'vw';
    el.style.top = (15 + Math.random()*70)+'vh';
    const dur = 2.2 + Math.random()*1.4;
    el.style.animationDuration = dur+'s';
    document.body.appendChild(el);
    setTimeout(()=> el.remove(), dur*1000 + 50);
  }
  setInterval(spawnSparkle, 900);

  function spawnTapHeart(x, y){
    const el = document.createElement('div');
    el.className = 'tap-heart';
    el.textContent = '💗';
    el.style.left = x+'px';
    el.style.top = y+'px';
    document.body.appendChild(el);
    setTimeout(()=> el.remove(), 950);
  }

  // confetti burst (used after the cake is cut)
  function confettiBurst(originEl){
    const colors = ['#e88d8d','#f2c879','#e4694a','#fbf3e7'];
    const rect = originEl.getBoundingClientRect();
    const originX = rect.left + rect.width/2;
    const originY = rect.top + rect.height/2;
    for(let i=0;i<70;i++){
      const p = document.createElement('div');
      p.className='confetti-piece';
      const size = 5 + Math.random()*6;
      p.style.width = size+'px';
      p.style.height = (size*0.6)+'px';
      p.style.background = colors[Math.floor(Math.random()*colors.length)];
      p.style.left = originX + 'px';
      p.style.top = originY + 'px';
      document.body.appendChild(p);

      const angle = Math.random()*Math.PI*2;
      const dist = 140 + Math.random()*280;
      const dx = Math.cos(angle)*dist;
      const dy = Math.sin(angle)*dist - 120;
      const rot = Math.random()*720 - 360;
      const dur = 1400 + Math.random()*900;

      p.animate([
        { transform:'translate(0,0) rotate(0deg)', opacity:1 },
        { transform:`translate(${dx}px, ${dy+420}px) rotate(${rot}deg)`, opacity:0 }
      ], { duration: dur, easing:'cubic-bezier(.2,.8,.3,1)' });

      setTimeout(()=> p.remove(), dur+50);
    }
    // a few celebratory emoji too
    const emojiSet = ['🎈','🎉','✨','💖','🎊'];
    for(let i=0;i<18;i++){
      const e = document.createElement('div');
      e.className = 'burst-piece';
      e.textContent = emojiSet[Math.floor(Math.random()*emojiSet.length)];
      e.style.left = originX+'px';
      e.style.top = originY+'px';
      document.body.appendChild(e);
      const angle = Math.random()*Math.PI*2;
      const dist = 100 + Math.random()*220;
      const dx = Math.cos(angle)*dist;
      const dy = Math.sin(angle)*dist - 140;
      const dur = 1200 + Math.random()*900;
      e.animate([
        { transform:'translate(-50%,-50%) scale(0)', opacity:0 },
        { transform:'translate(-50%,-50%) scale(1.3)', opacity:1, offset:0.2 },
        { transform:`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0.8) rotate(${Math.random()*360}deg)`, opacity:0 }
      ], { duration: dur, easing:'cubic-bezier(.25,1,.5,1)' });
      setTimeout(()=> e.remove(), dur+50);
    }
  }

  const deck = document.getElementById('deck');
  const dotsEl = document.getElementById('dots');

  // panda SVG markup (reused for intro-completion moments)
  function pandaFrame(size){
    return `<div class="panda-frame${size==='small' ? ' small' : ''}"><img src="panda.gif" alt="a cute waving panda"></div>`;
  }

  // ---- slide 0: cake-cutting scene ----
  const cakeSlide = document.createElement('div');
  cakeSlide.className = 'slide';
  cakeSlide.innerHTML = `
    <div class="eyebrow">a little something for you</div>
    <h2 class="cake-instruction" id="cakeInstruction">Make a wish, then tap the cake ✨</h2>
    <div class="cake-wrapper" id="cakeWrapper">
      <div class="knife-wrapper" id="cakeKnife">
        <svg viewBox="0 0 40 200" width="34" height="170" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#aaaaaa" />
              <stop offset="50%" stop-color="#ffffff" />
              <stop offset="100%" stop-color="#cccccc" />
            </linearGradient>
            <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#3e2723" />
              <stop offset="50%" stop-color="#5d4037" />
              <stop offset="100%" stop-color="#3e2723" />
            </linearGradient>
          </defs>
          <path d="M 18 63 L 22 63 L 22 180 Q 20 200 18 190 Z" fill="url(#bladeGrad)" />
          <path d="M 21 63 L 22 63 L 22 180 Q 20 200 21 190 Z" fill="#ffffff" opacity="0.8" />
          <rect x="14" y="0" width="12" height="60" fill="url(#handleGrad)" rx="2" />
          <rect x="12" y="55" width="16" height="8" fill="#d4af37" rx="2" />
          <ellipse cx="20" cy="5" rx="7" ry="5" fill="#d4af37" />
        </svg>
      </div>
      <div class="cake-3d-container" id="cakeContainer">
        <div class="cake-half left" id="cakeLeft"></div>
        <div class="cake-half right" id="cakeRight"></div>
      </div>
    </div>
  `;
  deck.appendChild(cakeSlide);

  // inject the SVG cake illustration into both halves (used for the clip-path split)
  const cakeSVG = `
<svg viewBox="0 0 200 200" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#cccccc"/>
    </linearGradient>
    <linearGradient id="plateRimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0e0e0"/><stop offset="100%" stop-color="#999999"/>
    </linearGradient>
    <linearGradient id="bottomTierGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8e1e55"/><stop offset="50%" stop-color="#c12973"/><stop offset="100%" stop-color="#69143e"/>
    </linearGradient>
    <linearGradient id="bottomTierTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc3e8a"/><stop offset="100%" stop-color="#aa2463"/>
    </linearGradient>
    <linearGradient id="topTierGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eac6d0"/><stop offset="50%" stop-color="#ffffff"/><stop offset="100%" stop-color="#d9b1bd"/>
    </linearGradient>
    <linearGradient id="topTierTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#fdf0f4"/>
    </linearGradient>
    <linearGradient id="dripGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#fae3eb"/>
    </linearGradient>
    <linearGradient id="candleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#dddddd"/>
    </linearGradient>
    <radialGradient id="flameGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff178" stop-opacity="0.8"/><stop offset="50%" stop-color="#ff9800" stop-opacity="0.4"/><stop offset="100%" stop-color="#ff0000" stop-opacity="0"/>
    </radialGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity="0.2"/>
    </filter>
  </defs>
  <ellipse cx="100" cy="180" rx="95" ry="20" fill="url(#plateRimGrad)" filter="url(#dropShadow)"/>
  <ellipse cx="100" cy="177" rx="85" ry="16" fill="url(#plateGrad)"/>
  <ellipse cx="100" cy="170" rx="70" ry="18" fill="#501030" opacity="0.6" filter="url(#dropShadow)"/>
  <path d="M 30 120 L 30 170 A 70 18 0 0 0 170 170 L 170 120 Z" fill="url(#bottomTierGrad)"/>

    if(cut) return;
    cut = true;

    cakeInstruction.style.opacity = '0';

    // blow out the candle
    document.querySelectorAll('.svg-flame, .svg-flame-glow').forEach(f => {
      f.style.opacity = '0';
      f.style.transform = 'scale(0)';
    });

    // bring the knife down
    setTimeout(() => cakeKnife.classList.add('slashing'), 500);

    // impact shake
    setTimeout(() => cakeContainer.classList.add('shaking'), 1300);

    // split the cake + light burst + confetti
    setTimeout(() => {
      cakeContainer.classList.remove('shaking');
      cakeWrapper.classList.add('cut');
      const light = document.createElement('div');
      light.className = 'magical-light';
      cakeWrapper.appendChild(light);
      confettiBurst(cakeWrapper);
    }, 1600);

    // move on to the letter
    setTimeout(() => next(), 3400);
  }
  cakeWrapper.addEventListener('click', (e) => { e.stopPropagation(); cutCakeSequence(); });

  function resetCake(){
    cut = false;
    cakeWrapper.classList.remove('cut');
    cakeKnife.classList.remove('slashing');
    cakeInstruction.style.opacity = '1';
    document.querySelectorAll('.svg-flame, .svg-flame-glow').forEach(f => {
      f.style.opacity = '';
      f.style.transform = '';
    });
    const light = cakeWrapper.querySelector('.magical-light');
    if(light) light.remove();
  }

  document.getElementById('replayBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    resetCake();
    goTo(0);
  });

  document.getElementById('zoneRight').addEventListener('click', (e) => {
    if(current === 0 && !cut) return;
    spawnTapHeart(e.clientX, e.clientY);
    next();
  });
  document.getElementById('zoneLeft').addEventListener('click', (e) => {
    spawnTapHeart(e.clientX, e.clientY);
    prev();
  });

  document.addEventListener('keydown', (e) => {
    if(e.key === 'ArrowRight') { if(!(current===0 && !cut)) next(); }
    if(e.key === 'ArrowLeft') prev();
  });

  let touchStartX = null;
  document.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
  });
  document.addEventListener('touchend', (e) => {
    if(touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if(Math.abs(dx) > 50){
      if(dx < 0){ if(!(current===0 && !cut)) next(); }
      else prev();
    }
    touchStartX = null;
  });
</script>

</body>
</html>
